<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Entre Lac et Morgon - Activités</title>
    <!-- Base Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Votre fichier CSS unique -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- En-tête / Menu de navigation commun -->
    <header class="container">
		<nav>
            <ul>
                <li>
                    <a href="index.html">
                        <img src="img/logo.jpg" alt="Logo" class="logo-club">
                        <strong>Club Entre Lac et Morgon</strong>
                    </a>
                </li>
            </ul>
            <ul>
                <li><a href="presentation.html">Présentation</a></li>
                <li><a href="activites.html">Activités</a></li>
                <li><a href="photos.html">Photos</a></li>
                <li><a href="#" role="button" class="contrast">Adhérer</a></li>
            </ul>
        </nav>
    </header>
    <!-- Bannière Hero -->
    <header class="hero">
        <hgroup>
            <h1>Club Entre Lac et Morgon</h1>
            <h3>Découvrez nos prochaines sorties et événements</h3>
        </hgroup>
    </header>

    <!-- Contenu spécifique : Activités -->
    <main class="container">
        <h2>Nos Activités</h2>
        <div id="activites-container">
            <p>Chargement des activités en cours...</p>
        </div>
        <!-- Vue Visionneuse Intégrée (Masquée par défaut) -->
        <div id="viewer-container" style="display: none; margin-top: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 id="viewer-title" style="margin: 0;"></h3>
                <button onclick="fermerVisionneuse()" class="secondary">Retour</button>
            </div>
            <iframe id="pdf-frame" src="" width="100%" height="600px" style="border: 1px solid #ccc; border-radius: 8px;"></iframe>
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="container">
        <small>© 2026 Club Entre Lac et Morgon</small>
    </footer>

    <!-- Script de configuration et de récupération des données -->
    <script src="config.js"></script>
	<script>
		let allActivites = [];
		fetch(GAS_EXEC_URL)
		    .then(response => response.json())
		    .then(data => {
		        const container = document.getElementById('activites-container');
		        container.innerHTML = '';

		        if (!data.activites || data.activites.length === 0) {
		            container.innerHTML = '<p>Aucun document disponible dans cette section.</p>';
		            return;
		        }

		        allActivites = data.activites;

		        data.activites.forEach((doc, index) => {
		            let article = document.createElement('article');
		            article.innerHTML = `
		                <header style="display: flex; justify-content: space-between; align-items: center;">
		                    <strong>${doc.name}</strong>
		                    <button onclick="ouvrirDoc(${index})" class="contrast outline" style="margin: 0; padding: 0.4rem 1rem;">Consulter</button>
		                </header>
		            `;
		            container.appendChild(article);
		        });
		    })
		    .catch(error => {
		        console.error('Erreur :', error);
		        document.getElementById('activites-container').innerHTML = '<p>Impossible de charger les documents.</p>';
		    });

		function ouvrirDoc(index) {
		    let doc = allActivites[index];
		    document.getElementById('viewer-title').innerText = doc.name;
		    document.getElementById('pdf-frame').src = doc.fileUrl;
		    
		    // Bascule l'affichage
		    document.getElementById('activites-container').style.display = 'none';
		    document.getElementById('viewer-container').style.display = 'block';
		    window.scrollTo({ top: 200, behavior: 'smooth' });
		}

		function fermerVisionneuse() {
		    document.getElementById('pdf-frame').src = ''; // Arrête le chargement du PDF
		    document.getElementById('viewer-container').style.display = 'none';
		    document.getElementById('activites-container').style.display = 'block';
		}
	</script>
    </body>
</html>
