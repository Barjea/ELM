{% extends "layout.html" %}

{% block content %}
<main class="container">
    <h2>Galerie Photos</h2>

    <!-- Zone dynamique remplie par JavaScript -->
    <div class="grid-photos" id="galerie-photos-container">
        <p>Chargement des photos...</p>
    </div>
</main>>

<style>
    /* Grille adaptative : 3 colonnes par défaut, 1 sur mobile */
    .grid-photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        padding: 1rem 0;
    }

    .photo-card {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        height: 250px; /* Hauteur fixe pour une grille régulière */
    }

    .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Recadre proprement l'image sans la déformer */
        transition: transform 0.3s ease;
    }

    .photo-card img:hover {
        transform: scale(1.05); /* Petit zoom au survol */
    }
</style>

<script>
    fetch(GAS_EXEC_URL)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('galerie-photos-container');
            container.innerHTML = '';

            if (!data.photos || data.photos.length === 0) {
                container.innerHTML = '<p>Aucune photo dans le dossier pour le moment.</p>';
                return;
            }

            data.photos.forEach(photoUrl => {
                let card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `<img src="${photoUrl}" alt="Photo Club">`;
                container.appendChild(card);
            });
        })
        .catch(error => {
            console.error('Erreur lors du chargement des photos :', error);
            document.getElementById('galerie-photos-container').innerHTML = '<p>Impossible de charger la galerie photos.</p>';
        });
</script>
{% endblock %}
