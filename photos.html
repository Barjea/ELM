<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Entre Lac et Morgon - Galerie photos</title>
    <!-- Base Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Votre fichier CSS unique -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- En-tête / Menu de navigation commun -->
    <header class="container">
		<nav>
            <ul>
                <li>
                    <a href="index.html">
                        <img src="img/logo.jpg" alt="Logo" class="logo-club">
                        <strong>Club Entre Lac et Morgon</strong>
                    </a>
                </li>
            </ul>
            <ul>
                <li><a href="presentation.html">Présentation</a></li>
                <li><a href="activites.html">Activités</a></li>
                <li><a href="photos.html">Photos</a></li>
                <li><a href="#" role="button" class="contrast">Adhérer</a></li>
            </ul>
        </nav>
    </header>
    <!-- Bannière Hero -->
    <header class="hero">
        <hgroup>
            <h1>Club Entre Lac et Morgon</h1>
            <h3>Découvrez nos prochaines sorties et événements</h3>
        </hgroup>
    </header>

	<main class="container">
		<h2>Galerie Photos</h2>

		<!-- Zone dynamique remplie par JavaScript -->
		<div class="grid-photos" id="galerie-photos-container">
		    <p>Chargement des photos...</p>
		</div>
	</main>

    <!-- Pied de page -->
    <footer class="container">
        <small>© 2026 Club Entre Lac et Morgon</small>
    </footer>

    <!-- Script de configuration et de récupération des données -->
    <script src="config.js"></script>



<style>
    /* Grille adaptative : 3 colonnes par défaut, 1 sur mobile */
    .grid-photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        padding: 1rem 0;
    }

    .photo-card {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        height: 250px; /* Hauteur fixe pour une grille régulière */
    }

    .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Recadre proprement l'image sans la déformer */
        transition: transform 0.3s ease;
    }

    .photo-card img:hover {
        transform: scale(1.05); /* Petit zoom au survol */
    }
</style>

	<script>
		fetch(GAS_EXEC_URL)
		    .then(response => response.json())
		    .then(data => {
		        const container = document.getElementById('galerie-photos-container');
		        container.innerHTML = '';

		        if (!data.photos || data.photos.length === 0) {
		            container.innerHTML = '<p>Aucune photo dans le dossier pour le moment.</p>';
		            return;
		        }

		        data.photos.forEach(photo => {
		            let card = document.createElement('div');
		            card.className = 'photo-card';
		            // On utilise photo.url pour la source et photo.name pour l'attribut alt
		            card.innerHTML = `<img src="${photo.url}" alt="${photo.name}">`;
		            container.appendChild(card);
		        });
		    })
		    .catch(error => {
		        console.error('Erreur lors du chargement des photos :', error);
		        document.getElementById('galerie-photos-container').innerHTML = '<p>Impossible de charger la galerie photos.</p>';
		    });
	</script>
    </body>
</html>
