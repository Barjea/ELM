<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Entre Lac et Morgon</title>
    <!-- Base Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Votre fichier CSS unique -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- En-tête / Menu de navigation commun -->
    <header class="container">
		<nav>
            <ul>
                <li>
                    <a href="index.html">
                        <img src="img/logo.jpg" alt="Logo" class="logo-club">
                        <strong>Club Entre Lac et Morgon</strong>
                    </a>
                </li>
            </ul>
            <ul>
                <li><a href="presentation.html">Présentation</a></li>
                <li><a href="activites.html">Activités</a></li>
                <li><a href="photos.html">Photos</a></li>
                <li><a href="#" role="button" class="contrast">Adhérer</a></li>
            </ul>
        </nav>
    </header>
    <!-- Bannière Hero -->
    <header class="hero">
        <hgroup>
            <h1>Club Entre Lac et Morgon</h1>
            <h3>Découvrez nos prochaines sorties et événements</h3>
        </hgroup>
    </header>

    <!-- Contenu spécifique de la page d'accueil -->
    <main class="container">
        <h2>Prochains Événements</h2>
        <div id="evenements-container">
            <p>Chargement des événements en cours...</p>
        </div>
    </main>
    
    <!-- Pied de page -->
    <footer class="container">
        <small>© 2026 Club Entre Lac et Morgon</small>
    </footer>

    <!-- Script de récupération des données Google Apps Script -->
    <script src="config.js"></script>

<script>
        fetch(GAS_EXEC_URL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('evenements-container'); // ← Corrigé ici
                container.innerHTML = ''; // Nettoyage du message de chargement

                if (!data.evenements || data.evenements.length === 0) {
                    container.innerHTML = '<p>Aucun événement programmé pour le moment.</p>';
                    return;
                }

                data.evenements.forEach(evenement => {
                    let article = document.createElement('article');
                    article.innerHTML = `
                        <header><strong>${evenement.titre}</strong></header>
                        <div class="event-content">
                            <div class="event-info">
                                <p class="description-principale">${evenement.description}</p>
                                <div class="info-line">
                                    <p>📅 <strong>Date :</strong> ${evenement.date} à ${evenement.heure}</p>
                                    <p>📍 <strong>Lieu :</strong> ${evenement.lieu}</p>
                                    <p>💰 <strong>Prix :</strong> ${evenement.prix}</p>
                                    ${evenement.places ? `<p>👥 <strong>Places :</strong> ${evenement.places}</p>` : ''}
                                </div>                    
                            </div>
                            <div class="event-actions">
                                <div class="button-group">
                                    <a href="${evenement.fileUrl}" target="_blank" class="contrast outline">Détails</a>                    
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(article);
                });
            })
            .catch(error => {
                console.error('Erreur lors du chargement des données :', error);
                document.getElementById('evenements-container').innerHTML = '<p>Impossible de charger les événements pour le moment.</p>'; // ← Corrigé ici aussi
            });
    </script>
    </body>
</html>
